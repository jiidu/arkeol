<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Arkeol v0.3 – an open source archaeological mining game for the browser.">
<title>Arkeol</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game" aria-label="Game"></canvas>
<div id="vign"></div><div id="hurt"></div>
<div id="ui">
  <div id="hud">
    <div class="grp" id="hp"></div>
    <div class="grp" id="status" hidden></div>
    <div class="grp"><span class="lbl" data-i18n="lblMoney"></span><b id="money">$0</b></div>
    <div class="grp" id="fuelGrp"><span class="lbl" data-i18n="lblDrill"></span><span class="bar"><i id="fuel"></i></span></div>
    <div class="grp"><span class="lbl" data-i18n="lblDepth"></span><b id="depth">40 m</b></div>
    <span class="spacer"></span>
    <button class="hbtn" id="mapBtn" type="button" aria-pressed="false" data-i18n="btnMap"></button>
    <button class="hbtn" id="musicBtn" type="button" aria-pressed="true" data-i18n="btnMusic"></button>
    <button class="hbtn" id="muteBtn" type="button" aria-pressed="true" data-i18n="btnSound"></button>
    <button class="hbtn" id="pauseBtn" type="button" data-i18n="btnPause"></button>
  </div>
  <div id="hotbar"></div>
  <div id="slotName"></div>
  <canvas id="mini" width="174" height="156" hidden></canvas>
  <div id="achs"></div>
  <div id="talk" hidden></div>
  <div id="hint" hidden></div>
  <div id="ver">v0.3</div>
  <div id="toast"><div class="kick" id="toastKick"></div><div class="big" id="toastBig"></div><div class="small" id="toastSmall"></div></div>
  <div id="touch">
    <div class="pad l">
      <button class="up" data-act="up" aria-label="Up">▲</button>
      <button class="lt" data-act="left" aria-label="Left">◀</button>
      <button class="dn" data-act="down" aria-label="Down">▼</button>
      <button class="rt" data-act="right" aria-label="Right">▶</button>
    </div>
    <div class="pad r">
      <button data-act="dig" data-i18n="tDig"></button>
      <button data-act="use" data-i18n="tUse"></button>
      <button class="jump" data-act="jump" data-i18n="tJump"></button>
      <button data-act="act" data-i18n="tAct"></button>
      <button data-act="bomb" data-i18n="tBomb"></button>
    </div>
  </div>
</div>
<div id="fade"></div>

<div id="menu" class="screen">
  <div class="menuCol">
    <div class="kicker" data-i18n="kicker"></div>
    <div class="logoWrap"><h1 class="logo" data-text="ARKEOL">ARKEOL</h1><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i></div>
    <nav class="menuList" aria-label="Main menu">
      <button class="mBtn primary" id="startBtn" type="button" data-i18n="newGame"></button>
      <button class="mBtn" data-open="wardrobe" type="button" data-i18n="wardrobe"></button>
      <button class="mBtn" data-open="archive" type="button" data-i18n="archive"></button>
      <button class="mBtn" data-open="achv" type="button" data-i18n="achievements"></button>
      <button class="mBtn" data-open="settings" type="button" data-i18n="settings"></button>
      <button class="mBtn" data-open="credits" type="button" data-i18n="credits"></button>
    </nav>
    <p class="records" id="records" hidden></p>
  </div>
  <div class="menuVer">v0.3</div>
</div>

<div id="wardrobe" class="screen" hidden>
  <div class="card wide">
    <h2 data-i18n="wardrobe"></h2>
    <div class="wardrobe"><canvas id="wPrev" width="128" height="128" aria-hidden="true"></canvas><div id="wRows"></div></div>
    <p class="prog" id="wProg"></p>
    <div class="row" style="margin-top:14px"><button class="btn2 closeScreen" type="button" data-i18n="close"></button></div>
  </div>
</div>

<div id="howto" class="screen" hidden>
  <div class="card wide">
    <h2 data-i18n="howtoTitle"></h2>
    <div data-i18n="howtoBody"></div>
    <div class="row"><button class="btn2 closeScreen" type="button" data-i18n="close"></button></div>
  </div>
</div>

<div id="settings" class="screen" hidden>
  <div class="card">
    <h2 data-i18n="settings"></h2>
    <div class="setRows">
      <div class="setRow"><span data-i18n="language"></span><span><button class="stamp" type="button" data-lang="en" aria-pressed="true">EN</button> <button class="stamp" type="button" data-lang="fi" aria-pressed="false">FI</button></span></div>
      <label class="setRow" for="musicVol"><span data-i18n="musicVol"></span><input type="range" id="musicVol" min="0" max="100" step="5"></label>
      <label class="setRow" for="sfxVol"><span data-i18n="sfxVol"></span><input type="range" id="sfxVol" min="0" max="100" step="5"></label>
      <label class="setRow" for="shakeOpt"><span data-i18n="shakeOpt"></span><input type="checkbox" id="shakeOpt"></label>
    </div>
    <div class="row"><button class="btn2" data-open="howto" type="button" data-i18n="howto"></button><button class="btn2 closeScreen" type="button" data-i18n="close"></button></div>
  </div>
</div>

<div id="credits" class="screen" hidden>
  <div class="card">
    <h2 data-i18n="credits"></h2>
    <div data-i18n="creditsBody"></div>
    <div class="row"><button class="btn2 closeScreen" type="button" data-i18n="close"></button></div>
  </div>
</div>

<div id="license" class="screen" hidden>
  <div class="card">
    <h2 data-i18n="license"></h2>
    <div data-i18n="licenseBody"></div>
    <div class="row"><button class="btn2 closeScreen" type="button" data-i18n="close"></button></div>
  </div>
</div>

<div id="over" class="screen" hidden>
  <div class="card">
    <div class="tomb"><div class="rip" data-i18n="overTitle"></div><p class="epitaph" id="epitaph"></p></div>
    <p class="newRec" id="newRec" hidden></p>
    <p class="sub recap" id="cause"></p>
    <div class="stats">
      <span data-i18n="sDepth"></span><b id="oDepth"></b>
      <span data-i18n="sEarned"></span><b id="oMoney" style="color:var(--gold)"></b>
      <span data-i18n="sGems"></span><b id="oGems" style="color:var(--gem)"></b>
      <span data-i18n="sRelics"></span><b id="oRelics"></b>
      <span data-i18n="sBest"></span><b id="oBest"></b>
    </div>
    <div class="row"><button class="btn" id="againBtn" type="button" data-i18n="newExp"></button><button class="btn2" data-open="archive" type="button" data-i18n="archive"></button><button class="btn2" id="toMenuBtn" type="button" data-i18n="toMenu"></button></div>
  </div>
</div>

<div id="pause" class="screen" hidden>
  <div class="card" style="text-align:center">
    <h1 data-i18n="pauseTitle"></h1>
    <p class="sub" style="margin-inline:auto" data-i18n="pauseHint"></p>
    <div class="row" style="justify-content:center"><button class="btn" id="resumeBtn" type="button" data-i18n="resume"></button><button class="btn2" data-open="archive" type="button" data-i18n="archive"></button><button class="btn2" data-open="achv" type="button" data-i18n="achievements"></button><button class="btn2" data-open="settings" type="button" data-i18n="settings"></button><button class="btn2" id="quitBtn" type="button" data-i18n="quit"></button></div>
  </div>
</div>

<div id="modal" class="screen" hidden>
  <div class="card" id="modalCard">
    <div id="modalBody"></div>
    <div class="row" style="margin-top:18px;justify-content:center"><button class="btn" id="modalClose" type="button" data-i18n="continue"></button></div>
  </div>
</div>

<div id="archive" class="screen" hidden>
  <div class="card wide">
    <h2 data-i18n="archive"></h2>
    <p class="prog" id="archProg"></p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="papers" aria-selected="true" data-i18n="tabPapers"></button>
      <button class="tab" role="tab" data-tab="photos" aria-selected="false" data-i18n="tabPhotos"></button>
      <button class="tab" role="tab" data-tab="relics" aria-selected="false" data-i18n="tabRelics"></button>
    </div>
    <div class="agrid" id="archGrid"></div>
    <div class="row" style="margin-top:16px"><button class="btn2 closeScreen" type="button" data-i18n="close"></button></div>
  </div>
</div>

<div id="achv" class="screen" hidden>
  <div class="card wide">
    <h2 data-i18n="achievements"></h2>
    <p class="prog" id="achProg"></p>
    <div class="ach" id="achGrid" style="margin-top:12px"></div>
    <div class="row" style="margin-top:16px"><button class="btn2 closeScreen" type="button" data-i18n="close"></button></div>
  </div>
</div>

<div id="shop" class="screen" hidden>
  <div class="card wide">
    <div class="shopHead"><canvas id="sabu" width="32" height="32"></canvas><div><h2 data-i18n="shopTitle"></h2><div class="say" id="sabuSay"></div><div class="wallet" id="shopMoney"></div></div></div>
    <div class="shopGrid" id="shopGrid"></div>
    <div class="row" style="margin-top:16px"><button class="btn2" id="shopClose" type="button" data-i18n="leaveShop"></button><span class="best only-keys" data-i18n="escCloses"></span></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/lore.js"></script>
<script src="js/wardrobe.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
